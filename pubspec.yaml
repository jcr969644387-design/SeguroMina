name: seguromina
description: >-
  Entrenador de identificación de peligros y evaluación IPERC para estudiantes
  de Ingeniería de Minas. Funciona sin conexión.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado e inyección de dependencias.
  # Riverpod sobre Provider/BLoC: DI verificada en compilación y providers
  # testeables sin WidgetTester.
  flutter_riverpod: ^2.5.1

  # Navegación declarativa. Se cablea en el Módulo 2.
  go_router: ^14.2.0

  # Modelos inmutables y parsing seguro del contenido de escenarios.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persistencia del progreso. Drift (SQLite) porque los intentos son datos
  # relacionales que hay que agregar por escenario y por tipo de peligro.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.23
  path_provider: ^2.1.3
  path: ^1.9.0

  # Preferencias simples (tema, escala de texto, idioma).
  shared_preferences: ^2.2.3

  # Escenas vectoriales. SVG escala sin pérdida y permite zonas activas
  # con coordenadas relativas.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/i18n/
    - assets/content/
    - assets/content/scenarios/
    - assets/images/scenes/

# Nota: no se usa google_fonts. La app es offline-first y las tipografías
# descargadas en tiempo de ejecución romperían esa garantía. Se usa la
# tipografía del sistema hasta que se decida empaquetar una familia propia.
