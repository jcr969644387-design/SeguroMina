name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisis estatico
        run: flutter analyze --fatal-infos

      - name: Pruebas
        run: flutter test --coverage

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-apk:
    name: Construir APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # El proyecto se versiona sin la carpeta android/ generada, para que el
      # repositorio contenga solo codigo propio. Se regenera en cada build.
      - name: Generar plataforma Android
        run: flutter create --platforms=android .

      - name: Construir APK de depuracion
        run: flutter build apk --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: seguromina-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
